
name: Extract YarShodan ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract ZIP into YarShodan
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "YarShodan.zip" ]; then
            echo "ERROR: YarShodan.zip was not found."
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          unzip -q "YarShodan.zip" -d "$TEMP_DIR"

          COUNT="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)"
          SOURCE="$TEMP_DIR"

          if [ "$COUNT" -eq 1 ] && [ -d "$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          mkdir -p YarShodan
          cp -a "$SOURCE"/. YarShodan/

          echo "ZIP extracted into YarShodan."
          find YarShodan -maxdepth 2 -type f | head -n 50

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YarShodan
          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Extract YarShodan.zip into YarShodan folder"
            git push
          fi
