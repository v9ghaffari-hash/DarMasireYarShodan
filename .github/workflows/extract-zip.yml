
name: Extract YarShodan ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract ZIP into YarShodan
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for file in YarShodan.zip project.zip Project.zip; do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file was not found."
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          COUNT="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)"
          SOURCE="$TEMP_DIR"

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          mkdir -p YarShodan
          cp -a "$SOURCE"/. YarShodan/

          rm -rf "$TEMP_DIR"

          echo "ZIP extracted into YarShodan."
          find YarShodan -maxdepth 3 -type f | head -n 100

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add YarShodan

          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Extract Android project into YarShodan folder"
            git push
          fi
