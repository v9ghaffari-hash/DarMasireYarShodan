
name: Extract Any ZIP File

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP files..."

          mapfile -t zip_files < <(find . -maxdepth 1 -type f -iname "*.zip" ! -path "./.git/*" | sort)

          if [ ${#zip_files[@]} -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          mkdir -p extracted

          for zip_file in "${zip_files[@]}"; do
            echo "Extracting: $zip_file"

            folder_name="$(basename "$zip_file" .zip)"
            folder_name="${folder_name%.*}"

            # Make folder name safe
            folder_name="$(echo "$folder_name" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"

            if [ -z "$folder_name" ]; then
              folder_name="extracted_project"
            fi

            target="extracted/$folder_name"
            mkdir -p "$target"

            unzip -o "$zip_file" -d "$target"

            echo "Extracted into: $target"
          done

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted

          if git diff --cached --quiet; then
            echo "No new extracted files to commit."
          else
            git commit -m "Extract ZIP files automatically"
            git push
          fi
