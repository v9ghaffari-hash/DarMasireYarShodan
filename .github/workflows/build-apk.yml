name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'YadAvarYar/**'
      - 'app/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '1/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
            gradle_version="8.13"
          elif [[ -f "YadAvarYar/settings.gradle.kts" && -f "YadAvarYar/app/build.gradle.kts" ]]; then
            project_dir="YadAvarYar"
            gradle_version="8.13"
          elif [[ -f "1/settings.gradle" && -f "1/app/build.gradle" ]]; then
            project_dir="1"
            gradle_version="8.11.1"
          else
            echo "::error::Android project not found. Put settings.gradle(.kts), build.gradle(.kts), and app/ in the repository root, or keep the complete project inside YadAvarYar/."
            echo "Root contents:"
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$gradle_version" >> "$GITHUB_ENV"
          echo "Selected project directory: $project_dir"
          echo "Selected Gradle version: $gradle_version"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify project files
        run: |
          test -f "$PROJECT_DIR/settings.gradle" -o -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarMasireYar-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
