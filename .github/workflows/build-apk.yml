
name: Build YarShodan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP
        run: |
          if [ ! -f YarShodan.zip ]; then
            echo "ERROR: YarShodan.zip not found in repository root"
            ls -la
            exit 1
          fi

          unzip -t YarShodan.zip

      - name: Extract Kotlin project
        run: |
          mkdir -p "$RUNNER_TEMP/yarshodan"
          unzip -q YarShodan.zip -d "$RUNNER_TEMP/yarshodan"

          PROJECT_FILE=$(find "$RUNNER_TEMP/yarshodan" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            find "$RUNNER_TEMP/yarshodan" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Locate APK
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/yarshodan-apk"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} "$RUNNER_TEMP/yarshodan-apk/" \;

          if [ -z "$(ls -A "$RUNNER_TEMP/yarshodan-apk")" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/yarshodan-apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YarShodan-debug-apk
          path: ${{ runner.temp }}/yarshodan-apk/*.apk
          if-no-files-found: error
