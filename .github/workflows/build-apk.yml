
name: Build DarMasireYarShodan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -lah
          test -f project.zip

      - name: Extract Android project
        run: |
          unzip -o project.zip -d extracted
          ls -la extracted/ChillehyarMahdaviV37

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          cd extracted/ChillehyarMahdaviV37
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarMasireYarShodan-APK
          path: extracted/ChillehyarMahdaviV37/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
