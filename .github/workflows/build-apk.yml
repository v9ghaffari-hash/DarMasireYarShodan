
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check project
        run: |
          cd extracted/project/ChillehyarMahdaviV37
          ls -la

      - name: Build APK
        working-directory: extracted/project/ChillehyarMahdaviV37
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DarMasireYarShodan-APK
          path: extracted/project/ChillehyarMahdaviV37/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
