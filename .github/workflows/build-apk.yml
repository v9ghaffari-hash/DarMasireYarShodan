
name: Build YarShodan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP file
        run: |
          if [ ! -f YarShodan.zip ]; then
            echo "ERROR: YarShodan.zip not found in repository root."
            ls -la
            exit 1
          fi

          echo "ZIP contents:"
          unzip -Z1 YarShodan.zip | head -80

      - name: Extract and locate Android project
        run: |
          mkdir -p "$RUNNER_TEMP/yarshodan"
          unzip -q YarShodan.zip -d "$RUNNER_TEMP/yarshodan"

          echo "Searching for Gradle project..."
          find "$RUNNER_TEMP/yarshodan" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \)

          PROJECT_FILE=$(find "$RUNNER_TEMP/yarshodan" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No Gradle settings file found in ZIP."
            echo "The ZIP may not contain a complete Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find and upload APK
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          find "$PROJECT_DIR" -type f -name '*.apk' \
            -path '*/outputs/apk/debug/*' \
            -exec cp {} "$RUNNER_TEMP/apk/" \;

          if [ -z "$(ls -A "$RUNNER_TEMP/apk")" ]; then
            echo "ERROR: No debug APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YarShodan-debug-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
